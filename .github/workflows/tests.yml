name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ⚠️ O piso REAL do pacote é 8.1 (`src/Response/ApiResponse.php` usa
        # `readonly`), e o composer.json foi corrigido de ^8.0 para ^8.1.
        #
        # A matriz, porém, começa em 8.2: o Pest 2/3 arrasta o
        # `brianium/paratest`, que exige PHP >= 8.2. Ou seja, a versão mínima
        # SUPORTADA não é testável com este runner — e é melhor ter isso
        # escrito aqui do que fingir cobertura que não existe.
        php: ['8.2', '8.4']
        stability: [prefer-lowest, prefer-stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: ./vendor/bin/pest
